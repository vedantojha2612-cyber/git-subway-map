[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-subway-map"
version = "1.0.0"
description = "Transform Git commit DAGs into Tokyo and London Underground schematic subway transit maps."
readme = "README.md"
authors = [
    { name = "Git Subway Map Contributors" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "git",
    "git-graph",
    "git-visualizer",
    "subway-map",
    "metro-map",
    "octolinear",
    "transit-map",
    "dag",
    "fastapi",
    "react",
    "timeline"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Artistic Software",
    "Topic :: Scientific/Engineering :: Visualization"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "dulwich>=0.21.0"
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "build>=1.0.0"
]

[project.scripts]
git-subway-map = "backend.cli:run"

[project.urls]
Homepage = "https://github.com/vedantojha2612-cyber/git-subway-map"
Documentation = "https://github.com/vedantojha2612-cyber/git-subway-map#readme"
Repository = "https://github.com/vedantojha2612-cyber/git-subway-map.git"
Issues = "https://github.com/vedantojha2612-cyber/git-subway-map/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.setuptools.package-data]
"*" = [
    "frontend/dist/**/*",
    "frontend/dist/*"
]
